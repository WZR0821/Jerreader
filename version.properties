# 读鼠（Jerreader）的唯一版本号来源。
#
# iOS 与 Android 从 1.3.0 起共用同一组数字。两端各自维护版本号是两个仓库时代
# 留下的习惯，结果是 iOS 走到 1.2.4 (50) 时 Android 还停在 1.1.2 (47)，用户
# 报 bug 时说的"版本"两边对不上号。
#
# Android: versionName / versionCode 由 androidApp/build.gradle.kts 读这里。
# iOS:     MARKETING_VERSION / CURRENT_PROJECT_VERSION 由 iosApp/Version.xcconfig
#          读这里 —— 那份文件由 iosApp/Scripts/sync-version.sh 生成，改完这里
#          跑一次脚本即可（./gradlew syncIosVersion 也会生成）。
versionName=1.5.1
versionCode=60
